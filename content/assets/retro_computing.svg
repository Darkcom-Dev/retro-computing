<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600' viewBox='0 0 800 600'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' style='stop-color:#0a0a2e'/>
      <stop offset='100%' style='stop-color:#1a0a3e'/>
    </linearGradient>
    <linearGradient id='crts' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' style='stop-color:#2a2a4a'/>
      <stop offset='100%' style='stop-color:#1a1a3a'/>
    </linearGradient>
  </defs>
  <rect width='800' height='600' fill='url(#bg)'/>
  <!-- Monitor CRT -->
  <rect x='180' y='80' width='440' height='340' rx='20' fill='#222' stroke='#444' stroke-width='3'/>
  <rect x='200' y='100' width='400' height='280' rx='5' fill='#001020'/>
  <!-- Pantalla con scanlines -->
  <line x1='200' y1='120' x2='600' y2='120' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='140' x2='600' y2='140' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='160' x2='600' y2='160' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='180' x2='600' y2='180' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='200' x2='600' y2='200' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='220' x2='600' y2='220' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='240' x2='600' y2='240' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='260' x2='600' y2='260' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='280' x2='600' y2='280' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='300' x2='600' y2='300' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='320' x2='600' y2='320' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='340' x2='600' y2='340' stroke='#00ff4140' stroke-width='1'/>
  <line x1='200' y1='360' x2='600' y2='360' stroke='#00ff4140' stroke-width='1'/>
  <!-- Texto en la pantalla -->
  <text x='400' y='220' font-family='monospace' font-size='28' fill='#00ff41' text-anchor='middle' filter='url(#glow)'>RETRO</text>
  <text x='400' y='260' font-family='monospace' font-size='18' fill='#00cc33' text-anchor='middle'>COMPUTING</text>
  <text x='400' y='300' font-family='monospace' font-size='12' fill='#008822' text-anchor='middle'>Loading...</text>
  <text x='210' y='330' font-family='monospace' font-size='10' fill='#006611'>C:\></text>
  <!-- Soporte monitor -->
  <rect x='370' y='420' width='60' height='20' fill='#333'/>
  <rect x='350' y='440' width='100' height='10' rx='5' fill='#444'/>
  <!-- Teclado -->
  <rect x='150' y='470' width='500' height='100' rx='10' fill='#2a2a2a' stroke='#444' stroke-width='2'/>
  <g fill='#444'>
    <rect x='170' y='485' width='35' height='30' rx='3'/><rect x='215' y='485' width='35' height='30' rx='3'/>
    <rect x='260' y='485' width='35' height='30' rx='3'/><rect x='305' y='485' width='35' height='30' rx='3'/>
    <rect x='350' y='485' width='35' height='30' rx='3'/><rect x='395' y='485' width='35' height='30' rx='3'/>
    <rect x='440' y='485' width='35' height='30' rx='3'/><rect x='485' y='485' width='35' height='30' rx='3'/>
    <rect x='530' y='485' width='35' height='30' rx='3'/><rect x='575' y='485' width='35' height='30' rx='3'/>
    <rect x='200' y='525' width='40' height='30' rx='3'/><rect x='250' y='525' width='300' height='30' rx='3'/>
    <rect x='560' y='525' width='40' height='30' rx='3'/>
  </g>
  <!-- Led power -->
  <circle cx='200' cy='445' r='4' fill='#00ff41' opacity='0.8'>
    <animate attributeName='opacity' values='0.8;0.3;0.8' dur='2s' repeatCount='indefinite'/>
  </circle>
  <!-- Estrella fugaz pixel art -->
  <g transform='translate(80,60)'>
    <rect x='60' y='10' width='3' height='3' fill='#ff0'/>
    <rect x='50' y='15' width='3' height='3' fill='#ff0'/>
    <rect x='40' y='20' width='3' height='3' fill='#ff0'/>
    <rect x='30' y='25' width='3' height='3' fill='#ff0' opacity='0.5'/>
    <animate attributeName='opacity' values='1;0;1' dur='3s' repeatCount='indefinite'/>
  </g>
  <!-- Disquete pixel art -->
  <g transform='translate(650, 130)'>
    <rect x='0' y='0' width='50' height='60' rx='3' fill='#1a3355' stroke='#334466' stroke-width='2'/>
    <rect x='10' y='5' width='30' height='20' rx='2' fill='#cc3333'/>
    <rect x='18' y='10' width='14' height='10' rx='1' fill='#aa2222'/>
    <rect x='15' y='35' width='20' height='15' rx='1' fill='#224488'/>
    <rect x='16' y='36' width='18' height='13' rx='1' fill='#2a5599'/>
  </g>
</svg>